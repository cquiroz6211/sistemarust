[package]
name = "transport"
version = "0.1.0"
edition = "2024"

[dependencies]
protocol = { path = "../protocol" }
bevy = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "time", "macros"] }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
